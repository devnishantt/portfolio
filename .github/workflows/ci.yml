name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * *"   # refresh the status page data daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Unit tests (lab logic and build output)
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests (every lab, desktop and mobile)
        run: |
          node scripts/serve.mjs &
          for i in $(seq 1 20); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 0.5; done
          node tests/e2e.mjs http://localhost:3000/ shots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore

  # Vercel deploys on every push to main. This job refreshes data/status.json once a day and
  # commits it, which triggers a new Vercel deploy. It never runs for pull requests.
  refresh-status:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh CI status data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/fetch_status.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/status.json
          git diff --cached --quiet || (git commit -m "chore: refresh CI status data" && git push)
